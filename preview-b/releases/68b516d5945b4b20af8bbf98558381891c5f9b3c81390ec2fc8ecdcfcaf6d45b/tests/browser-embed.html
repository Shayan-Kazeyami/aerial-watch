<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aerial embed smoke check</title>
<style>body{margin:0;font:16px system-ui;background:#f0ede7;color:#202a2c}header{padding:16px}button{font:inherit;padding:10px}iframe{display:block;width:100%;height:920px;border:0}p{max-width:80ch}</style></head>
<body><header><strong>Integration test host</strong><p>This is a test wrapper, not the Kazeyami website. The viewer runs in an isolated iframe with relative asset paths. Check rendering, controls, downloads and file import, then remove and restore it.</p><button id="toggle" type="button">Remove viewer</button></header><main id="host"></main>
<script type="module">
const host=document.querySelector('#host'),button=document.querySelector('#toggle');
function mount(){const frame=document.createElement('iframe');frame.src='../integrated-preview.html?quality=efficient&paused=1';frame.title='Aerial interactive watch';frame.allow='fullscreen';host.append(frame);button.textContent='Remove viewer';}
button.onclick=()=>{if(host.firstChild){host.replaceChildren();button.textContent='Restore viewer';}else mount();};mount();
</script></body></html>
