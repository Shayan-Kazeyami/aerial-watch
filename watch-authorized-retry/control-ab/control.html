<!doctype html><meta charset="utf-8"><title>Simple WebGL2 control</title>
<style>html,body{margin:0;background:#18201d}#stage{position:absolute;left:0;top:88px;width:100vw;height:calc(100vh - 254px)}canvas{width:100%;height:100%;display:block}</style>
<div id="stage"><canvas id="control"></canvas></div>
<script>
const c=document.querySelector('canvas'),s=document.querySelector('#stage');
// Exact recorded stage sizes for the matching viewport; no viewer code/assets.
const mobile=innerWidth===430;s.style.top=(mobile?92:88)+'px';s.style.height=(mobile?760:546)+'px';
const gl=c.getContext('webgl2',{antialias:true,preserveDrawingBuffer:false});
if(!gl)throw Error('Simple control WebGL2 unavailable');
const shader=(type,source)=>{const x=gl.createShader(type);gl.shaderSource(x,source);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x};
const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,'#version 300 es\nin vec2 xy;void main(){gl_Position=vec4(xy,0.,1.);}'));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;out vec4 color;void main(){color=vec4(.15+gl_FragCoord.x/4000.,.3+gl_FragCoord.y/2000.,.9,1.);}'));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-.8,-.7,.8,-.7,0,.8]),gl.STATIC_DRAW);const a=gl.getAttribLocation(p,'xy');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
const debug=gl.getExtension('WEBGL_debug_renderer_info');
window.controlState={frames:0,contextLost:false,version:gl.getParameter(gl.VERSION),renderer:gl.getParameter(gl.RENDERER),contextAttributes:gl.getContextAttributes(),unmaskedRenderer:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):null,unmaskedVendor:debug?gl.getParameter(debug.UNMASKED_VENDOR_WEBGL):null};c.addEventListener('webglcontextlost',()=>controlState.contextLost=true);
window.controlScale=x=>{c.width=Math.round(s.clientWidth*x);c.height=Math.round(s.clientHeight*x);gl.viewport(0,0,c.width,c.height)};controlScale(1);
function render(){gl.clearColor(.07,.11,.09,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);controlState.frames++;requestAnimationFrame(render)}render();
</script>
