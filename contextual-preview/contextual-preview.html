<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Object interaction UI preview</title><style>body{margin:0;background:#262f2b;color:#eee;font:16px system-ui}header{padding:24px;pointer-events:none}canvas{width:100vw;height:70vh;display:block;touch-action:none}p{padding:0 24px}</style><header>Interaction UI preview · hover or tap the crown target</header><canvas id="target" width="1000" height="600" tabindex="0" aria-label="Crown interaction target"></canvas><p id="result" role="status">No action taken</p><script type="module">
import {createContextualUI} from './assembly-contextual-ui.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),target={name:'Crown'};ctx.fillStyle='#b5a78a';ctx.beginPath();ctx.arc(500,300,85,0,Math.PI*2);ctx.fill();ctx.fillStyle='#18241f';ctx.font='24px system-ui';ctx.textAlign='center';ctx.fillText('Crown',500,308);
createContextualUI({canvas,pick(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1000/r.width,y=(e.clientY-r.top)*600/r.height;return Math.hypot(x-500,y-300)<85?target:null},describe:()=>({label:'Crown',hint:'Drag up or down to turn. Pull out to set the hands.',actions:[{label:'Pull out · set time',run:()=>document.querySelector('#result').textContent='Crown action invoked'},{label:'Turn left',run:()=>document.querySelector('#result').textContent='Turn left action invoked'}]})});
</script>
