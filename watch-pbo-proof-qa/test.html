<!doctype html><meta charset="utf-8"><title>Isolated PBO feasibility</title><canvas id="c" width="128" height="96"></canvas>
<script type="module">
import {createPBOProof} from './pbo-proof.mjs';import {createReadbackVideoFrame} from './original-frame.mjs';
window.runProof=async()=>{
 const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2',{preserveDrawingBuffer:false,antialias:false});if(!gl)throw Error('WebGL2 unavailable');
 const assert=(ok,msg)=>{if(!ok)throw Error(msg)};const same=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);
 let current=null;function draw(i){if(current?.active)throw Error('Renderer mutation blocked during readback');gl.enable(gl.SCISSOR_TEST);for(let q=0;q<4;q++){gl.scissor((q%2)*64,Math.floor(q/2)*48,64,48);gl.clearColor(((i*17+q*53)%256)/255,((i*31+q*7)%256)/255,((i*11+q*41)%256)/255,1);gl.clear(gl.COLOR_BUFFER_BIT);}gl.disable(gl.SCISSOR_TEST);}
 class PixelFrame{constructor(p){this.pixels=new Uint8Array(p);}close(){}}const original=createReadbackVideoFrame({canvas,gl,Frame:PixelFrame});
 const state=()=>({width:canvas.width,height:canvas.height,framebuffer:gl.getParameter(gl.FRAMEBUFFER_BINDING),pack:gl.getParameter(gl.PIXEL_PACK_BUFFER_BINDING),viewport:[...gl.getParameter(gl.VIEWPORT)],alignment:gl.getParameter(gl.PACK_ALIGNMENT)});
 const initial=state();current=createPBOProof({canvas,gl});let hashes=[];
 for(let i=0;i<12;i++){draw(i);const f=original({timestamp:i}),expected=f.pixels;f.close();const result=await current.read();assert(same(expected,result),'RGBA mismatch frame '+i);const topLeftQ=2;assert(result[0]===(i*17+topLeftQ*53)%256&&result[1]===(i*31+topLeftQ*7)%256&&result[3]===255,'Color/orientation mismatch');assert(JSON.stringify(state())===JSON.stringify(initial),'Source/state mutated');assert(gl.getError()===gl.NO_ERROR,'WebGL error');hashes.push(Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',result))).map(x=>x.toString(16).padStart(2,'0')).join(''));}assert(new Set(hashes).size===12,'Frame order/content collapsed');original.release();const parityAudit={...current.audit};
 // Hold after genuine buffer/fence submission, before completion observation.
 let resume;current=createPBOProof({canvas,gl,pause:()=>new Promise(r=>resume=r)});draw(13);const ctl=new AbortController();const pending=current.read({signal:ctl.signal});await Promise.resolve();assert(current.active,'Not active');let overlap=false;try{await current.read();}catch(e){overlap=/already active/.test(e.message);}assert(overlap,'Overlapping read accepted');let mutation=false;try{draw(14);}catch(e){mutation=/mutation blocked/.test(e.message);}assert(mutation,'Renderer guard failed');ctl.abort();resume();try{await pending;throw Error('Abort accepted');}catch(e){assert(e.name==='AbortError','Wrong abort');}assert(!current.active,'Abort active leak');const abortAudit={...current.audit};assert(abortAudit.createdBuffers===abortAudit.deletedBuffers&&abortAudit.createdSyncs===abortAudit.deletedSyncs,'Abort GPU-object leak');
 // Preserve original synchronous fallback when async capability is absent.
 const missing=new Proxy(gl,{get(t,k){if(k==='fenceSync'||k==='getBufferSubData')return undefined;const v=t[k];return typeof v==='function'?v.bind(t):v;}});current=createPBOProof({canvas,gl:missing});draw(15);const f=original({timestamp:15}),fallback=await current.read();assert(same(f.pixels,fallback),'Original fallback mismatch');f.close();original.release();const fallbackAudit={...current.audit};
 // Real context loss while asynchronous proof owns PBO/fence; no restore/run loop.
 const ext=gl.getExtension('WEBGL_lose_context');assert(ext,'Context loss extension unavailable');let release;current=createPBOProof({canvas,gl,pause:()=>new Promise(r=>release=r)});draw(16);const lost= current.read();await Promise.resolve();const event=new Promise(r=>canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();r();},{once:true}));ext.loseContext();await event;release();let lossError;try{await lost;}catch(e){lossError=e.message;}assert(lossError==='Context lost','Context loss not rejected');assert(!current.active,'Context loss active leak');const lossAudit={...current.audit};assert(lossAudit.createdBuffers===lossAudit.deletedBuffers&&lossAudit.createdSyncs===lossAudit.deletedSyncs,'Context loss cleanup not called');
 return {passed:true,scope:'isolated 128x96 software WebGL2 feasibility, 12frames, no Watch/phone/performance claim',hashes,sourceStatePreserved:true,overlapRejected:overlap,mutationRejected:mutation,parityAudit,abortAudit,fallbackAudit,lossAudit,actualInitialPendingStatus:gl.TIMEOUT_EXPIRED,notes:['Initial clientWaitSync statuses distinguish actual TIMEOUT_EXPIRED from an already signaled fence.','Context loss deletes/invalidate GPU resources; counters prove cleanup calls/JSownership, not measured VRAM.','Synthetic pixels are not watch visual acceptance or full export proof.']};
};
</script>
