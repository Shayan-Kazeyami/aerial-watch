name: Sealed transmission budget native release gate
on:
  push:
    branches: ['qa/transmission-release-20261108']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa-deliverables/transmission-release/build/build-release.mjs
      - name: Pack exact immutable release
        run: |
          python - <<'PY'
          import json,tarfile,pathlib
          r=json.load(open('transmission-output/sealed-release.json'))
          p=pathlib.Path(r['releasePath'])
          assert not p.is_absolute() and '..' not in p.parts
          with tarfile.open('transmission-output/sealed-release.tar.gz','w:gz') as t:
            t.add(p,arcname=str(p))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transmission-sealed-release
          path: transmission-output
  inspect:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Change only this value to live on the QA branch AFTER guarded main promotion.
      RELEASE_QA_MODE: sealed
      RELEASE_RECEIPT: transmission-output/sealed-release.json
      RELEASE_QA_RESIZE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: transmission-sealed-release
          path: transmission-output
      - run: tar xzf transmission-output/sealed-release.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
      - run: timeout 25m python qa-deliverables/transmission-release/qa/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transmission-native-${{ env.RELEASE_QA_MODE }}
          path: transmission-qa-output
  stage:
    needs: [build, inspect]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/transmission-release-20261108
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: transmission-sealed-release
          path: transmission-output
      - name: Stage verified immutable release on QA branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          tar xzf transmission-output/sealed-release.tar.gz
          RELEASE=$(python -c "import json;print(json.load(open('transmission-output/sealed-release.json'))['releasePath'])")
          git add -- "$RELEASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Stage native-verified transmission budget release [skip ci]'
            git push origin HEAD:refs/heads/qa/transmission-release-20261108
          fi
          git rev-parse HEAD > staged-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: transmission-staged-receipt
          path: |
            staged-head.txt
            transmission-output/sealed-release.json
