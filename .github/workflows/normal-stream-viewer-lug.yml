name: Actual premium normal stream native Lugs QA
on:
  push:
    branches: [qa/normal-stream-viewer-lug-macos-20261114]
permissions:
  contents: read
jobs:
  viewer:
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QA_ARM: ${{ matrix.arm }}
      WATCH_BASE: preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright pillow && python -m playwright install chromium
      - name: Verify source and prepare isolated copy
        run: |
          python -c "import platform; print(platform.platform()); print(platform.machine())"
          python -m unittest discover -s watch-qa-infrastructure/normal-stream-viewer -p 'test_*.py' -v
          python watch-qa-infrastructure/normal-stream-viewer/prepare.py
      - name: One bounded actual viewer arm
        run: |
          python watch-qa-infrastructure/normal-stream-viewer/server.py >/tmp/normal-viewer-server.log 2>&1 &
          SERVER_PID=$!
          cleanup_server() {
            kill "$SERVER_PID" 2>/dev/null || true
            for i in $(seq 1 30); do
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then wait "$SERVER_PID" 2>/dev/null || true; return; fi
              sleep 0.1
            done
            kill -KILL "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          python - <<'PY'
          import urllib.request,time
          for i in range(40):
           try:urllib.request.urlopen('http://127.0.0.1:8765/',timeout=1);break
           except OSError:time.sleep(.25)
          else:raise RuntimeError('server not ready')
          PY
          python watch-qa-infrastructure/normal-stream-viewer/run-lug.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-viewer-lug-${{ matrix.arm }}-not-release-approval
          path: |
            watch-qa-infrastructure/normal-stream-viewer/evidence-lug-${{ matrix.arm }}/
            watch-qa-infrastructure/normal-stream-viewer/PREPARED-${{ matrix.arm }}.json
