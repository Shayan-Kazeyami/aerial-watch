name: Read-only public PNG and JSON capture verification
on:
  push:
    branches: [codex/watch-rel04-public-capture-qa]
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        viewport: [430x932, 932x430]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rel04-qa
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u rel04-qa/browser.py
        env:
          REL04_VIEWPORT: ${{ matrix.viewport }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rel04-public-capture-${{ matrix.viewport }}
          path: rel04-public-output
