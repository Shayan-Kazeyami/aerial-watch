name: Isolated bounded PBO pixel proof
on:
  push:
    branches: [codex/watch-pbo-proof]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: watch-pbo-proof-qa
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: timeout 40s python -u watch-pbo-proof-qa/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-pbo-proof
          path: watch-pbo-proof-qa/RESULT.json
