name: Watch CPU export scratch lifetime
on:
  push:
    branches: [codex/watch-export-cleanup]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: watch-export-cleanup-qa
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: node --expose-gc watch-export-cleanup-qa/candidate/cleanup.test.mjs
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u watch-export-cleanup-qa/browser-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-export-cleanup-proof
          path: watch-export-cleanup-qa/output
