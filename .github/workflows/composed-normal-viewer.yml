name: Composed normal viewer scoped QA
on:
  push:
    branches: [qa/composed-normal-viewer-20261114]
    paths: [watch-composed-normal-viewer-qa/**, .github/workflows/composed-normal-viewer.yml]
permissions:
  contents: read
jobs:
  viewer:
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
        kind: [desktop, portrait]
    runs-on: macos-latest
    env:
      QA_ARM: ${{ matrix.arm }}
      QA_KIND: ${{ matrix.kind }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 64fff6296e7d23f00ef387fa222ef405da3c8fba
          path: normal-fixture
      - uses: actions/checkout@v4
        with:
          ref: e305819445671ba9bc24734a902646204a08801e
          path: seconds-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy playwright pillow && python -m playwright install chromium
      - run: |
          cd normal-fixture
          tar -xzf hardware-current-fixture.tar.gz -C hardware-normal-qa
          node hardware-normal-qa/ci-bake.mjs preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6/rebuild/assembly.glb
          node hardware-normal-qa/e79-rebase/ci-encode.mjs
      - run: |
          cd seconds-fixture
          python qa-seconds-ring/pack.py preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6/premium-face/face-svg04.glb
          node qa-seconds-ring/encode.mjs
      - run: |
          export WATCH_BASE=preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6
          export NORMAL_INPUT=normal-fixture/hardware-normal-qa/e79-rebase
          export RING_INPUT=seconds-fixture/qa-seconds-ring
          export RUNTIME_INPUT=coordinated-release-successor
          python watch-error-redaction-build/build.py
          python watch-error-redaction-build/verify_closure.py
          node --check watch-error-redaction-build/assembly-review-reset-candidate.js
          node --test --test-reporter=tap watch-error-redaction-build/test.mjs watch-error-redaction-build/adversarial-regressions.test.mjs watch-error-redaction-build/existing-regressions.test.mjs > watch-error-redaction-build/security-tests.tap
          cat watch-error-redaction-build/security-tests.tap
          node watch-error-redaction-build/quality-status-test.mjs
          node watch-error-redaction-build/runtime-check.mjs
          python watch-normal-stream-build/build.py
          python watch-normal-stream-build/verify.py
          node --test --test-reporter=tap watch-normal-stream-build/test-staged.mjs > watch-normal-stream-build/tests.tap
          cat watch-normal-stream-build/tests.tap
      - name: Prepare controlled bootstrap and viewer copy
        run: |
          python -c "import platform; print(platform.platform()); print(platform.machine())"
          python watch-composed-normal-viewer-qa/prepare.py
          python -m unittest discover -s watch-composed-normal-viewer-qa -p 'test_*.py' -v
          python -m py_compile watch-composed-normal-viewer-qa/run.py
          node --check watch-composed-normal-viewer-qa/snapshot-hook.js
      - name: One bounded composed viewer arm
        run: |
          python watch-composed-normal-viewer-qa/server.py >/tmp/composed-server.log 2>&1 &
          SERVER_PID=$!
          cleanup_server() {
            kill "$SERVER_PID" 2>/dev/null || true
            for i in $(seq 1 30); do
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then wait "$SERVER_PID" 2>/dev/null || true; return; fi
              sleep 0.1
            done
            kill -KILL "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          python - <<'PY'
          import urllib.request,time
          for i in range(40):
           try:urllib.request.urlopen('http://127.0.0.1:8765/',timeout=1);break
           except OSError:time.sleep(.25)
          else:raise RuntimeError('server not ready')
          PY
          python watch-composed-normal-viewer-qa/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composed-${{ matrix.arm }}-${{ matrix.kind }}-not-release-approval
          path: |
            watch-composed-normal-viewer-qa/evidence-${{ matrix.arm }}-${{ matrix.kind }}/
            watch-composed-normal-viewer-qa/PREPARED-${{ matrix.arm }}.json
            watch-normal-stream-build/build-report.json
            watch-normal-stream-build/release-id.txt
            watch-normal-stream-build/tests.tap
            watch-error-redaction-build/build-report.json
            watch-error-redaction-build/closure-verification.json
            watch-error-redaction-build/quality-status-report.json
            watch-error-redaction-build/runtime-structural-report.json
            watch-error-redaction-build/release-id.txt
            watch-error-redaction-build/security-tests.tap
