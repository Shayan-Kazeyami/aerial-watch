name: Seconds ring isolated normal QA
on:
  push:
    branches: [qa/seconds-ring-normals-20261114]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python qa-seconds-ring/server.py > /tmp/qa-ring-server.log 2>&1 &
          python qa-seconds-ring/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seconds-ring-normal-qa-evidence
          path: qa-seconds-ring/evidence
