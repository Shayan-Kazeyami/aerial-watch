name: Isolated live export cleanup regression
on:
  push:
    branches: ['qa/live-export-cleanup-20261108']
permissions:
  contents: read
jobs:
  exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: timeout 17m python qa/final-interaction/live-exports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-export-cleanup
          path: live-export-output
