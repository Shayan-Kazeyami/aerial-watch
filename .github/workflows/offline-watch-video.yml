name: Verify frame-by-frame watch export
on:
  push:
    branches: ['qa/offline-watch-video-20261111']
concurrency:
  group: offline-watch-video
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scope: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: SKIP_FFMPEG_TESTS=1 node --test offline-video-ci/tests/*.test.mjs
      - run: python offline-video-ci/build.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright av pillow
      - run: python -m playwright install chromium
      - run: python -m http.server 8765 > /tmp/watch-http.log 2>&1 &
      - run: timeout 34m env QA_SCOPE=${{ matrix.scope }} python -u offline-video-ci/product-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-watch-video-${{ matrix.scope }}
          path: offline-output
