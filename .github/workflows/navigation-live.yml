name: Verify published navigation
on:
  push:
    branches: ['qa/atelier-navigation-live-20261110']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -u watch-flow-ci/live-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-navigation-live
          path: live-evidence
