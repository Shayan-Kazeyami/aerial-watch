name: Isolated live reduced-motion explosion QA
on:
  push:
    branches: [qa/reduced-motion-explosion-20261114]
    paths: [qa-reduced-motion/**, .github/workflows/reduced-motion-explosion.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u qa-reduced-motion/browser-full.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reduced-motion-full-browser
          path: qa-reduced-motion/ci-evidence/
