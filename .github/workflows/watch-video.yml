name: Verify actual watch video
on:
  push:
    branches: ['qa/watch-video-20261111']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, mesa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && ffprobe -version
      - run: timeout 12m xvfb-run -a env MODE=${{ matrix.mode }} python -u watch-video-ci/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-watch-video-${{ matrix.mode }}
          path: webm-evidence
