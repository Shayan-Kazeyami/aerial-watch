name: Source-only side view foot350 access diagnostic
on:
  push:
    branches: [qa/mounting-foot-source-side-20261114]
    paths: [watch-qa-infrastructure/mounting-foot-viewer-validation/**, isolated-mounting-feet-exact-index/**, .github/workflows/mounting-foot-source-side.yml]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - name: Prepare exact isolated copy
        run: |
          WATCH_BASE=preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6 python watch-qa-infrastructure/mounting-foot-viewer-validation/prepare-source-side-viewer.py
          python watch-qa-infrastructure/mounting-foot-viewer-validation/test_driver_contract.py
          python watch-qa-infrastructure/mounting-foot-viewer-validation/test_source_side_contract.py
          python watch-qa-infrastructure/mounting-foot-viewer-validation/test_keyboard_motion.py
          python watch-qa-infrastructure/mounting-foot-viewer-validation/verify-source-side-closure.py
          node --check watch-qa-infrastructure/mounting-foot-viewer-validation/qa-source-side-viewer/preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6/assembly-review.js
      - name: One bounded actual viewer attempt
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory watch-qa-infrastructure/mounting-foot-viewer-validation/qa-source-side-viewer >/tmp/foot-http.log 2>&1 &
          python watch-qa-infrastructure/mounting-foot-viewer-validation/browser-driver-source-side.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mounting-foot-source-side-not-optimization-approval
          path: |
            watch-qa-infrastructure/mounting-foot-viewer-validation/QA_SOURCE_SIDE_COPY_REPORT.json
            watch-qa-infrastructure/mounting-foot-viewer-validation/browser-evidence-source-side/
            watch-qa-infrastructure/mounting-foot-viewer-validation/SOURCE_SIDE_URL_CLOSURE.json
