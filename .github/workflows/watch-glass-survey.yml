name: Watch current Studio glass boundary closeups
on:
  push:
    branches: [codex/watch-glass-survey]
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: watch-glass-survey-qa
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python -u watch-glass-survey-qa/survey.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-glass-closeups
          path: watch-glass-survey-qa/output
