name: Hybrid CASE live promotion verification
on:
  push:
    branches: ['qa/hybrid-integration-20261108']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python metal-recovery/integration-study/verify-live.py
      - run: python metal-recovery/integration-study/qa-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-live-evidence
          path: integration-output
