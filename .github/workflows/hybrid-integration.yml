name: Hybrid CASE sealed release gate
on:
  push:
    branches: ['qa/hybrid-integration-20261108']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright numpy scipy
      - run: python -m playwright install --with-deps chromium
      - run: |
          set -euo pipefail
          mkdir -p metal-recovery/cap-study integration-output
          ln -s ../preview-b/releases/f3ab38493b7bc5c4af84728add913e54938d0db276143a7b765a7803f361bb44 metal-recovery/source
          node metal-recovery/decode.mjs
          python metal-recovery/extract-default.py
          python metal-recovery/cap-study/graft-field-v7.py
          python metal-recovery/cap-study/export-v7.py
          npm ci --prefix metal-recovery --ignore-scripts --no-audit --no-fund
          node metal-recovery/pack-hybrid-v7.mjs
          node --test metal-recovery/integration-study/*.test.mjs | tee integration-output/unit-tests.txt
          python metal-recovery/integration-study/prepare-release.py
          node metal-recovery/integration-study/build-release.mjs
      - run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
      - run: python metal-recovery/integration-study/qa-release.py
      - name: Publish verified sealed candidate on QA branch only
        run: |
          set -euo pipefail
          RELEASE=$(python -c "import json;print(json.load(open('integration-output/sealed-release.json'))['releasePath'])")
          git add "$RELEASE"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Stage verified immutable hybrid CASE release [skip ci]'
          git push origin HEAD:qa/hybrid-integration-20261108
          git rev-parse HEAD > integration-output/staged-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-integration-evidence
          path: integration-output
