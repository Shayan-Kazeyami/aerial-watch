name: Isolated loading error polling lifecycle QA
on:
  push:
    branches: [qa/loading-error-poll-20261114]
    paths: [qa-loading-poll/**, .github/workflows/loading-poll-qa.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u qa-loading-poll/browser-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loading-poll-real-browser
          path: qa-loading-poll/evidence/
