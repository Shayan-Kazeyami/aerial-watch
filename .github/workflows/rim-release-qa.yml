name: Authored face immutable integration QA
on:
  push:
    branches: [qa/rim-release-20261113]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        viewport: [740x360]
        assets: [raw]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          RID=$(cat strap-retopology-qa/publish/release-id.txt)
          echo "$RID" > crown-unified-qa/release-id.txt
          echo "$RID" > layer-focus-qa/release-id.txt
          cp preview-b/releases/$RID/assembly-crown-hotspot.js crown-unified-qa/
          cp preview-b/releases/$RID/assembly-review.js crown-unified-qa/
          node --test crown-unified-qa/gesture.test.mjs
          python - <<'PY'
          import pathlib
          for name in ['crown-unified-qa/check.py','layer-focus-qa/check.py']:
           p=pathlib.Path(name);s=p.read_text()
           s=s.replace('quality=efficient','quality=efficient&assets=${{ matrix.assets }}')
           if name.startswith('layer-'): s=s.replace("atelier-preview.html'","atelier-preview.html?quality=efficient&assets=${{ matrix.assets }}'")
           p.write_text(s)
          PY
      - run: |
          python -m http.server 8765 >/tmp/watch-server.log 2>&1 &
          QA_VIEWPORT=${{ matrix.viewport }} python crown-unified-qa/check.py
          FOCUS_VIEWPORT=${{ matrix.viewport }} python layer-focus-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rim-integrated-${{ matrix.viewport }}-${{ matrix.assets }}
          path: |
            crown-unified-evidence
            layer-focus-evidence
