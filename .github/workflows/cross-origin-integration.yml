name: Cross-origin integration package regression
on:
  push:
    branches: ['qa/cross-origin-integration-20261108']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.1 pillow
      - run: python -m playwright install --with-deps chromium
      - run: python -m http.server 8766 --bind 127.0.0.1 > /tmp/host-server.log 2>&1 &
      - run: timeout 19m python qa/cross-origin/test.py
      - name: Summarize and verify evidence
        if: always()
        run: |
          test -f cross-origin-output/report.json
          python -c "import json; x=json.load(open('cross-origin-output/report.json')); print(json.dumps({k:x.get(k) for k in ('hostOrigin','viewerOrigin','phases','errors','setup_error')}))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-origin-integration
          path: cross-origin-output
          if-no-files-found: error
