name: Live mechanism batching verification
on:
  push:
    branches: [qa/mechanism-batch-live-20261113]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: |
          python mechanism-batch-qa/wait-live.py
          WATCH_URL="https://shayan-kazeyami.github.io/aerial-watch/preview-b/releases/ff188ba605b3868d174bec75b643470c86fb164c706c5ff0b2d4ee89c2472947/atelier-preview.html" python -u mechanism-batch-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mechanism-batch-evidence
          path: |
            mechanism-batch-output
            mobile-output
