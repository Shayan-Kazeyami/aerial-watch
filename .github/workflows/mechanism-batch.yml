name: Mechanism render batching quality comparison
on:
  push:
    branches: [qa/mechanism-batch-20261113]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: node mechanism-batch-qa/test.mjs
      - run: python mechanism-batch-qa/build.py
      - run: |
          python -m http.server 8765 >/tmp/watch-http.log 2>&1 &
          WATCH_URL="$(cat mechanism-batch-qa/url.txt)" python -u mechanism-batch-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mechanism-batch-evidence
          path: |
            mechanism-batch-output
            mobile-output
