name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-explode-ce5580ac.js, compact-explode-qa/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=ce5580ac6f1299485a507149235bee5135360b538564d3d28921d72da84b415b python compact-explode-qa/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-explode-live
          path: marked-live
