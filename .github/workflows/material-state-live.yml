name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-normal-5de34026.js, normal-stream-qa/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=5de340263d2bcb0a992914d7b0aa64176493934711907480b62bcad07bd486ca python normal-stream-qa/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-stream-live
          path: normal-stream-live
