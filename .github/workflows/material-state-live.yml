name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-crown-51e744f3.js, next-bottleneck-qa/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=51e744f388b6989632e125d50090f119ce36bd8781a9cb16587ecb3f5a7d2aad python next-bottleneck-qa/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-state-live
          path: marked-live
