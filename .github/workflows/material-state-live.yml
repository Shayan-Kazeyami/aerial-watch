name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-webgpu-f0148dab.js, webgpu-controls-qa/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=f0148dab28e427621143d47b157bc7802ebab4f661d2d530e2162c4508b4b485 python webgpu-controls-qa/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-benchmark-live
          path: webgpu-controls-live
