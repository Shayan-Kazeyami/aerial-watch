name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-geometry-75756356.js, case-topology-lane/integration/public-live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=75756356ca7b944a5143c519b75d3cac2f8aa62cfcf40302b249f7eefda85f69 python case-topology-lane/integration/public-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-crown-tube-live
          path: case-integrated-live
