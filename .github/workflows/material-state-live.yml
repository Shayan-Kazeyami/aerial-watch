name: Watch caseback live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-batch-9de584f6.js, watch-home-caseback-e79b2236.js, case-topology-lane/caseback-integration/public-live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=78f11a43161421beddc94469318c7530f2e5b9afeb14f7517e79c7a3e564c4e0 python case-topology-lane/caseback-integration/public-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caseback-integrated-live
          path: caseback-integrated-live
