name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-layer-21474059.js, layer-focus-qa/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=214740598c3327efb618f559ce587911d3893bd97a060a53172277877480a8b2 python layer-focus-qa/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer-focus-live
          path: layer-focus-live
