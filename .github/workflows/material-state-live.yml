name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-webgpu-c8b1cb38.js, webgpu-controls-qa/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=c8b1cb38f7f87904017b32735ca917b4216225cfd8f0a612590aafe689ada633 python webgpu-controls-qa/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-benchmark-live
          path: webgpu-controls-live
