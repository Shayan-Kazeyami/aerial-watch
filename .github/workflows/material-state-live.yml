name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-landscape-fad7fffe.js, landscape-budget-qa/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=fad7fffe84d3b72678dc0cfc7864c18e6bf779b4da88bb40d11aefedddcbb91c python landscape-budget-qa/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-budget-live
          path: landscape-budget-live
