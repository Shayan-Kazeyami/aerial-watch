name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-crown-63600a54.js, crown-unified-qa/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=63600a544b71214dcbfceee96a3eac0dbfa48bca7d42d59425acd43bae131bfd python crown-unified-qa/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crown-unified-live
          path: crown-unified-live
