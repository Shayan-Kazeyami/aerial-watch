name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-rim-8da6179f.js, strap-retopology-qa/publish/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=8da6179fe4cc360db298c64720b76933d2325d3a5c65b237aa7c83dc18178803 python strap-retopology-qa/publish/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rim-reconstruction-live
          path: crown-unified-live
