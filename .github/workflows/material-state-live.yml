name: Watch live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-retry-0c0dd309.js, normal-retry-qa/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=0c0dd309c80d8ce23e5743dac69555ffa3364e20664f2eb2474c1788e29f1d27 python normal-retry-qa/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-retry-live
          path: normal-retry-live
