name: Material-state batching live release check
on:
  push:
    branches: [main]
    paths: [index.html, watch-home-batch-3e9e591c.js, next-bottleneck-qa/live.py, .github/workflows/material-state-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: EXPECTED_RELEASE=3e9e591cbf61eaabb0b8dc9909c157514c9d14144b0dabdaa8543c368d0f4466 python next-bottleneck-qa/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-state-live
          path: marked-live
