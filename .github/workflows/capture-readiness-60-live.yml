name: Actual-live 60-second capture readiness five independent gates
on:
  push:
    branches: ['qa/capture-readiness-60-live-20261108']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa-deliverables/capture-readiness-60-release/build/build-release.mjs
      - name: Pack exact immutable release
        run: |
          python - <<'PY'
          import json,tarfile,pathlib
          r=json.load(open('capture-readiness-60-output/sealed-release.json'))
          p=pathlib.Path(r['releasePath']);assert not p.is_absolute() and '..' not in p.parts
          with tarfile.open('capture-readiness-60-output/sealed-release.tar.gz','w:gz') as t:t.add(p,arcname=str(p))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-readiness-60-live-receipt
          path: capture-readiness-60-output
          if-no-files-found: error
  inspect:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [native, cross-origin-1, cross-origin-2, cross-origin-3, cancel]
    env:
      CASE: ${{ matrix.case }}
      RELEASE_RECEIPT: capture-readiness-60-output/sealed-release.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: capture-readiness-60-live-receipt
          path: capture-readiness-60-output
      - run: tar xzf capture-readiness-60-output/sealed-release.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.1 pillow
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8766 --bind 127.0.0.1 > /tmp/host-server.log 2>&1 &
      - run: timeout 17m python qa-deliverables/capture-readiness-60-release/qa/qa-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-readiness-60-live-${{ matrix.case }}
          path: capture-readiness-60-live-output
          if-no-files-found: error
