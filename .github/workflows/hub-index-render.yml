name: Isolated indexed hub rendering fixture
on:
  push:
    branches: [qa/hub-index-render-20261114]
    paths: [watch-qa-infrastructure/hub-render-validation/**, .github/workflows/hub-index-render.yml]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - name: Verify exact inputs and preparation contracts
        run: |
          export WATCH_BASE=preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6
          python watch-qa-infrastructure/hub-render-validation/prepare.py
          python -m unittest discover -s watch-qa-infrastructure/hub-render-validation -p 'test_*.py' -v
          node --check watch-qa-infrastructure/hub-render-validation/fixture.js
      - name: One bounded browser fixture
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory watch-qa-infrastructure/hub-render-validation/fixture >/tmp/hub-http.log 2>&1 &
          python watch-qa-infrastructure/hub-render-validation/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-render-fixture-not-release-approval
          path: |
            watch-qa-infrastructure/hub-render-validation/IDENTITIES.json
            watch-qa-infrastructure/hub-render-validation/evidence/
