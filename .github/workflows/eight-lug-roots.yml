name: Eight lug root matched diagnosis
on:
  push:
    branches: ['qa/eight-lug-roots-20261108']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright numpy
      - run: python -m playwright install --with-deps chromium
      - run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
      - run: |
          mkdir -p metal-recovery/cap-study
          ln -s ../preview-b/releases/f3ab38493b7bc5c4af84728add913e54938d0db276143a7b765a7803f361bb44 metal-recovery/source
          node metal-recovery/decode.mjs
          python metal-recovery/extract-default.py
          python metal-recovery/cap-study/graft.py
          python metal-recovery/cap-study/export.py
      - run: python qa-metal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eight-lug-root-evidence
          path: metal-output
