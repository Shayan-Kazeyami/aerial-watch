name: Watch camera-only reset exact nonproduction seal
on:
  push:
    branches: [codex/watch-camera-reset-seal]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {view: 820x600, arm: candidate}
          - {view: 430x932, arm: candidate}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            watch-camera-reset-qa
            preview-b/releases/a09e63edcfc275e017ff9655270f0c1c733a95d075f55c0306e84ba70d1a07a8
            preview-b/releases/87a759964175034b479a36bd84035d0265cad0b6742306e1f7499ce4dca325e1
            preview-b/releases/9c055e4777a79c7987dd6cd5ccabf9f189121fd6c64e2f54853aa694827add06
            preview-b/releases/a2ee1cff3c620530dfd63add3ab7111ba493bfff9173d7de00802e9a97f75054
            preview-b/releases/f3ab38493b7bc5c4af84728add913e54938d0db276143a7b765a7803f361bb44
            preview-b/releases/fcaad311973aff1e27395d6f87ce363210b2d9a4d28b545e8c569f22831a5a72
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Serve and verify exact checkout
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/camera-qa-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/preview-b/releases/a09e63edcfc275e017ff9655270f0c1c733a95d075f55c0306e84ba70d1a07a8/atelier-preview.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/camera-qa-http.log
          exit 1
      - run: python -u watch-camera-reset-qa/browser_exact.py
        env:
          VIEW: ${{ matrix.view }}
          ARM: ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-seal-${{ matrix.view }}-${{ matrix.arm }}
          path: watch-camera-reset-qa/output/
