name: Isolated watch candidate QA
on:
  push:
    branches: ['qa/watch-winding-rest-visual-20261107']
permissions:
  contents: read
concurrency:
  group: watch-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        variant: [native, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out only QA tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: qa
      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore verified source and frozen candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 qa/restore-watch-candidate.py
      - name: Apply isolated calibrated rest candidate
        if: matrix.variant == 'candidate'
        run: python3 qa/winding-rest/apply.py candidate
      - name: Install pinned browser test harness
        run: npm install --prefix qa/browser --ignore-scripts --no-audit --no-fund
      - name: Install official Ubuntu media inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Controlled browser recovery and real export regression
        env:
          REST_VARIANT: ${{ matrix.variant }}
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          command -v ffprobe
          python3 -m http.server 8765 --bind 127.0.0.1 --directory candidate > /tmp/watch-http-resilience.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/atelier-preview.html >/dev/null && break; sleep 1; done
          cd qa/browser
          npx playwright test --config=winding-rest-visual.config.mjs
      - name: Preserve browser QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winding-rest-visual-${{ matrix.variant }}
          path: |
            qa/browser/artifacts
            qa/browser/html-report
            qa/browser/mechanism-artifacts
            qa/browser/mechanism-html-report
          if-no-files-found: ignore
          retention-days: 7
