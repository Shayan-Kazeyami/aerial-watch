name: Isolated live WebM validation
on:
  push:
    branches: ['qa/webm-cloud-20261108']
permissions:
  contents: read
jobs:
  webm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: timeout 12m python qa/webm-cloud/test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webm-cloud-evidence
          path: webm-output
