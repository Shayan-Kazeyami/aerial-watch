name: Current renderer bottleneck audit
on:
  push:
    branches: [qa/current-bottleneck-20261113]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pillow numpy && python -m playwright install --with-deps chromium
      - run: python next-bottleneck-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bottleneck-evidence
          path: bottleneck-evidence
