name: Isolated baked normals e79 QA
on:
  push:
    branches: [qa/hardware-baked-e79-20261114]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p hardware-normal-qa/e79-rebase hardware-normal-qa/offline-bake/evidence
          tar -xzf hardware-current-fixture.tar.gz -C hardware-normal-qa
          node hardware-normal-qa/ci-bake.mjs preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6/rebuild/assembly.glb
          node hardware-normal-qa/e79-rebase/ci-encode.mjs
          python -m http.server 8886 >/tmp/hardware-normal-server.log 2>&1 &
          python hardware-normal-qa/e79-rebase/viewer-check-meshopt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-baked-e79-evidence
          path: |
            hardware-normal-qa/offline-bake/evidence
            hardware-normal-qa/e79-rebase/report.json
