name: Isolated normal stream browser API QA macOS
on:
  push:
    branches: [qa/normal-stream-browser-macos-20261114]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install chromium
      - name: Record actual platform
        run: python -c "import platform; print(platform.platform()); print(platform.machine())"
      - name: Verify exact source inputs
        run: |
          export WATCH_BASE=preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6
          python watch-qa-infrastructure/normal-stream-browser/prepare.py
          node --check watch-qa-infrastructure/normal-stream-browser/fixture.mjs
          node watch-qa-infrastructure/normal-stream-browser/test-pending.mjs
      - name: One bounded browser API fixture
        run: |
          python watch-qa-infrastructure/normal-stream-browser/server.py >/tmp/normal-server.log 2>&1 &
          SERVER_PID=$!
          cleanup_server() {
            kill "$SERVER_PID" 2>/dev/null || true
            for i in $(seq 1 30); do
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then wait "$SERVER_PID" 2>/dev/null || true; return; fi
              sleep 0.1
            done
            kill -KILL "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup_server EXIT
          python - <<'PY'
          import urllib.request,time
          for i in range(40):
           try:
            urllib.request.urlopen('http://127.0.0.1:8765/',timeout=1);break
           except OSError:time.sleep(.25)
          else:raise RuntimeError('server not ready')
          PY
          python watch-qa-infrastructure/normal-stream-browser/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-stream-macos-not-viewer-approval
          path: watch-qa-infrastructure/normal-stream-browser/evidence/
