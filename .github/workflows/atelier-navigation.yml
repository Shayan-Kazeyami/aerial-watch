name: Atelier navigation QA
on:
  push:
    branches: ['qa/atelier-navigation-20261110']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node watch-crown-dot-ci/build.mjs
      - run: node --test watch-flow-ci/tests/*.test.mjs
      - run: node watch-flow-ci/build.mjs
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m http.server 8765 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
      - run: timeout 22m python -u watch-flow-ci/qa.py
      - run: |
          python - <<'PY'
          import json,tarfile,pathlib
          p=pathlib.Path(json.load(open('watch-flow-output/build.json'))['releasePath'])
          for n in ['qa-review.js','qa-atelier.js','qa-atelier.html']:
            (p/n).unlink(missing_ok=True)
          with tarfile.open('watch-flow-output/sealed-release.tar.gz','w:gz') as tar: tar.add(p,arcname=p.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-navigation-evidence
          path: watch-flow-output
