name: Exact tick batch geometry comparison
on:
  push:
    branches: [qa/tick-batch-20261112]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python tick-batch-qa/build.py
      - run: |
          python -m http.server 8765 >/tmp/watch-http.log 2>&1 &
          WATCH_URL="$(cat tick-batch-qa/url.txt)" python -u tick-batch-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tick-batch-evidence
          path: |
            tick-output
            mobile-output
