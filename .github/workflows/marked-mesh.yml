name: Marked strap and lug geometry QA
on:
  push:
    branches: [qa/marked-mesh-20261113]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install numpy scipy playwright pillow trimesh rtree && python -m playwright install --with-deps chromium
      - run: |
          ln -s ../preview-b marked-mesh-qa/preview-b
          python marked-mesh-qa/closure.py
          node marked-mesh-qa/prepare.mjs
          node marked-mesh-qa/simplify-target.mjs
          for i in 1 2 3 4 5 6 7; do python marked-mesh-qa/protect.py; node marked-mesh-qa/resimplify.mjs; done
          python marked-mesh-qa/protect.py --verify
          python marked-mesh-qa/pack.py
          node marked-mesh-qa/encode.mjs
          python marked-mesh-qa/build.py
      - run: |
          python -m http.server 8765 >/tmp/watch-http.log 2>&1 &
          WATCH_URL="$(cat marked-mesh-qa/url.txt)" python -u marked-mesh-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marked-mesh-evidence
          path: |
            marked-output
            marked-mesh-qa/build.json
            marked-mesh-qa/pack-report.json
