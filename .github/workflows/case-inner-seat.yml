name: Targeted case inner-seat geometry comparison
on:
  push:
    branches: [qa/case-inner-seat-20261112]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python case-fillet-qa/build.py
      - run: |
          python -m http.server 8765 >/tmp/watch-http.log 2>&1 &
          WATCH_URL="$(cat case-fillet-qa/url.txt)" python -u case-fillet-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-inner-seat-evidence
          path: |
            case-fillet-output
            mobile-output
