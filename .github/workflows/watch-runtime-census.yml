name: Watch runtime 421 census diagnostic
on:
  push:
    branches: ['codex/watch-runtime-census']
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify immutable input and conservative mappings
        run: |
          python watch-runtime-census-v1/verify_inputs.py
          python watch-runtime-census-v1/test_mapping.py
          python watch-runtime-census-v1/test_independent_mapping.py
          node --check watch-runtime-census-v1/probe.js
      - run: python -m pip install playwright pillow numpy && python -m playwright install --with-deps chromium
      - name: Capture actual runtime and calendar-only controls
        run: python -u watch-runtime-census-v1/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-runtime-census
          path: |
            watch-runtime-census-v1/output
            watch-runtime-census-v1/BINDING.json
