name: Crown tube structured topology QA
on:
  push:
    branches: [qa/crown-tube-20261113]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy triangle trimesh rtree playwright pillow && python -m playwright install --with-deps chromium
      - run: |
          python case-topology-lane/flanks/prepare-ci.py
          echo "http://127.0.0.1:8765/preview-b/releases/b38ddef36d153be511c40fc6d51795308a50440635edf1c97c39a725120cfdd3/atelier-preview.html" > case-topology-lane/url.txt
      - run: |
          python -m http.server 8765 >/tmp/watch-http.log 2>&1 &
          WATCH_URL="$(cat case-topology-lane/url.txt)" python -u case-topology-lane/hardware/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crown-tube-evidence
          path: |
            case-topology-output
            case-topology-lane/hardware/139/package.json
            case-topology-lane/hardware/139/report.json
