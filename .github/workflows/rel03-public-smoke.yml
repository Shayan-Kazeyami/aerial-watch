name: REL-03 read-only public video smoke
on:
  push:
    branches: [codex/watch-rel03-public-smoke]
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rel03-qa
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Actual public iframe, chooser cancel and a Compact video with decode/seek
        run: python -u rel03-qa/browser_public.py
        env:
          REL03_TEST_SIZE: compact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-rel03-public-compact
          path: rel03-qa/output
