name: Hardware canonical batch reuse acceptance
on:
  push:
    branches: [qa/hardware-reuse-current-20261114]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8877 >/tmp/hardware-reuse-server.log 2>&1 &
          python hardware-reuse-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-canonical-reuse-evidence
          path: hardware-reuse-qa/evidence
