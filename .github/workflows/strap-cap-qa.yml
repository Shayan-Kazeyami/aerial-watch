name: Outer atlas phase alignment matched KTX QA
on:
  push:
    branches: ['qa/strap-cap-20261108']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        end: [upper-left, upper-right, lower-left, lower-right]
    env:
      STRAP_QA_END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 playwright==1.64.1
      - run: |
          mkdir -p atlas-input
          cp preview-b/releases/10b61894f0b62d232d212d617924b891481ab8aa2018c5931063742f5d4dfaed/leather-assets/r14/geometry.bin atlas-input/
          cp preview-b/releases/10b61894f0b62d232d212d617924b891481ab8aa2018c5931063742f5d4dfaed/leather-assets/r14/leather.gltf atlas-input/leather-dropin.gltf
          python strap-density-study/atlas-seam-study/build_candidate.py atlas-input
      - run: python -m playwright install --with-deps chromium
      - run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
      - run: python strap-density-study/ci/atlas/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-${{ matrix.end }}
          path: |
            strap-output
            strap-density-study/atlas-candidate/*.json
            strap-density-study/atlas-candidate/round-cap-candidate
