name: UV14 sealed native four-end gate
on:
  push:
    branches: ['qa/strap-cap-20261108']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 triangle==20250106 shapely==2.2.0
      - run: python strap-density-study/ci/final-uv14/regenerate.py
      - name: Pack immutable sealed release
        run: |
          python - <<'PY'
          import json,tarfile
          r=json.load(open('strap-output/sealed-release.json'))
          with tarfile.open('strap-output/sealed-release.tar.gz','w:gz')as t:t.add(r['releasePath'],arcname=r['releasePath'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uv14-sealed-candidate
          path: |
            strap-output
            strap-density-study/ci-final-candidate/round-cap-candidate
            strap-density-study/ci-final-candidate/*.json
  inspect:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        end: [upper-right, upper-left, lower-right, lower-left]
    env:
      STRAP_QA_END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uv14-sealed-candidate
          path: downloaded
      - run: |
          mkdir -p strap-output
          cp downloaded/strap-output/sealed-release.json strap-output/
          tar xzf downloaded/strap-output/sealed-release.tar.gz
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
      - run: python strap-density-study/integration-qa/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uv14-native-${{ matrix.end }}
          path: strap-integration-output
  stage:
    needs: [generate, inspect]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/strap-cap-20261108
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: uv14-sealed-candidate
          path: downloaded
      - name: Stage verified sealed assets on QA branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          tar xzf downloaded/strap-output/sealed-release.tar.gz
          RELEASE=$(python -c "import json;print(json.load(open('downloaded/strap-output/sealed-release.json'))['releasePath'])")
          git add -- "$RELEASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage UV14 sealed candidate after native four-end tests [skip ci]'
          git push origin HEAD:refs/heads/qa/strap-cap-20261108
          git rev-parse HEAD > staged-head.txt
          cp downloaded/strap-output/sealed-release.json .
      - uses: actions/upload-artifact@v4
        with:
          name: uv14-staged-receipt
          path: |
            staged-head.txt
            sealed-release.json
