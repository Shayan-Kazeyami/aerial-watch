name: Strap cap actual KTX matched QA
on:
  push:
    branches: ['qa/strap-cap-20261108']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        end: [upper-left]
    env:
      STRAP_QA_END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 triangle==20250106 shapely==2.2.0 playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - name: Regenerate bounded private candidate
        run: python strap-qa/regenerate-uv14.py preview-b/releases/949a4881d119910ca28bdf5ef4d67dfdebc59df579e02a6de946db48668510c8/leather-assets/r14 strap-output/generated
      - run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
      - run: python strap-qa/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strap-uv14-${{ matrix.end }}
          path: |
            strap-output/*.png
            strap-output/*.json
            strap-density-study/uv14-candidate/*.json
            strap-density-study/uv14-candidate/round-cap-candidate
            strap-density-study/wide-uv14/*.json
