name: Exact matrix cache isolated regression
on:
  push:
    branches: [qa/exact-matrix-cache-20261114]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pillow numpy && python -m playwright install --with-deps chromium
      - run: python runtime-matrix-cache-audit/viewer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-matrix-cache-evidence
          path: runtime-matrix-cache-audit/viewer-evidence
