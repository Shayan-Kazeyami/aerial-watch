name: Isolated quality status encoding structural build
on:
  push:
    branches: [feature/quality-status-encoding-20261114]
    paths: [watch-quality-status-build/**, .github/workflows/quality-status-encoding-feature.yml]
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 64fff6296e7d23f00ef387fa222ef405da3c8fba
          path: normal-fixture
      - uses: actions/checkout@v4
        with:
          ref: e305819445671ba9bc24734a902646204a08801e
          path: seconds-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: |
          cd normal-fixture
          tar -xzf hardware-current-fixture.tar.gz -C hardware-normal-qa
          node hardware-normal-qa/ci-bake.mjs preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6/rebuild/assembly.glb
          node hardware-normal-qa/e79-rebase/ci-encode.mjs
      - run: |
          cd seconds-fixture
          python qa-seconds-ring/pack.py preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6/premium-face/face-svg04.glb
          node qa-seconds-ring/encode.mjs
      - run: |
          export WATCH_BASE=preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6
          export NORMAL_INPUT=normal-fixture/hardware-normal-qa/e79-rebase
          export RING_INPUT=seconds-fixture/qa-seconds-ring
          export RUNTIME_INPUT=coordinated-release-successor
          python watch-quality-status-build/build.py
          python watch-quality-status-build/verify_closure.py
          node --check watch-quality-status-build/assembly-review-reset-candidate.js
          node watch-quality-status-build/quality-status-test.mjs
          node watch-quality-status-build/runtime-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-status-encoding-structural-only
          path: |
            watch-quality-status-build/build-report.json
            watch-quality-status-build/closure-verification.json
            watch-quality-status-build/quality-status-report.json
            watch-quality-status-build/runtime-structural-report.json
            watch-quality-status-build/release-id.txt
