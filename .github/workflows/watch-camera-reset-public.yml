name: Watch camera-only reset actual public iframe
on:
  push:
    branches: [codex/watch-camera-reset-public]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {view: 820x600, arm: candidate}
          - {view: 430x932, arm: candidate}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: watch-camera-reset-qa
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u watch-camera-reset-qa/browser_public.py
        env:
          VIEW: ${{ matrix.view }}
          ARM: ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-public-${{ matrix.view }}-${{ matrix.arm }}
          path: watch-camera-reset-qa/output/
