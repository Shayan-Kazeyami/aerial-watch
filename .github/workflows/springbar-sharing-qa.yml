name: Springbar exact attribute runtime QA
on:
  push:
    branches: [qa/springbar-sharing-20261113]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python springbar-browser-qa/apply_candidate.py
      - run: |
          python -m http.server 8765 >/tmp/springbar-server.log 2>&1 &
          python springbar-browser-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: springbar-sharing-browser-evidence
          path: |
            springbar-browser-evidence
            springbar-browser-qa/springbar-reuse-candidate.json
