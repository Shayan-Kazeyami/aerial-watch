name: Watch public canonical cache transfer
on:
  push:
    branches: [codex/watch-cache-public]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: watch-cache-public-qa
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u watch-cache-public-qa/public-cache.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-cache-public
          path: watch-cache-public-output
