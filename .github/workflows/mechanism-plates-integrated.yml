name: Mechanism plates integrated current QA
on:
  push:
    branches: [qa/mechanism-plates-integrated-20261114]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,base64,io
          for p in Path('mechanism-plates-qa').glob('fixture-*.b64'):
              zipfile.ZipFile(io.BytesIO(base64.b64decode(p.read_text()))).extractall('.')
          PY
          python -m http.server 8873 >/tmp/watch-http.log 2>&1 &
          python -u mechanism-plates-qa/qa-integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mechanism-plates-integrated-evidence
          path: mechanism-plates-qa/integration-09e3
