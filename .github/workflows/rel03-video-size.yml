name: REL-03 video resolution candidate
on:
  push:
    branches: [codex/watch-rel03-video-size]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rel03-qa
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test rel03-qa/video-size.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Capture, decode and seek exact exported frame counts and dimensions
        run: python -u rel03-qa/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-rel03-video-qa
          path: rel03-qa/output
