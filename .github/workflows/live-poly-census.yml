name: Read-only deployed live Watch triangle census
on:
  push:
    branches: [qa/live-poly-census-20261114]
    paths: [live-poly-census/check.py, .github/workflows/live-poly-census.yml]
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u live-poly-census/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-live-poly-census
          path: live-poly-census/evidence
