name: Touch target diagnosis
on:
  push:
    branches: [qa/touch-target-20261113]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 >/tmp/watch-http.log 2>&1 &
          python -u touch-target-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touch-target-evidence
          path: touch-target-output
