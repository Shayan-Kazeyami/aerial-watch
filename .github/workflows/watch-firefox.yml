name: Watch public Firefox compatibility
on:
  push:
    branches: [codex/watch-firefox-live]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        arm: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            watch-firefox-qa
            preview-b/releases
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright && python -m playwright install --with-deps firefox
      - run: xvfb-run -a python -u watch-firefox-qa/test.py
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ARM: ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-header-${{ matrix.arm }}
          path: watch-firefox-qa/output/
