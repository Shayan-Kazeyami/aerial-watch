name: Inspect marked geometry
on:
  push:
    branches: ['qa/marked-geometry-20261110']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m http.server 8765 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
      - run: timeout 15m python -u marked-ci/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marked-geometry
          path: marked-output
