name: Stage verified immutable package for guarded promotion
on:
  push:
    branches: ['qa/publish-verified-cb5b4263']
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: qa
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2a8748aeabc70e75f10f63fa644bcad9f315f26f
          path: live
          persist-credentials: true
      - name: Verify unchanged production and retrieve exact approved artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "2a8748aeabc70e75f10f63fa644bcad9f315f26f"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/13588656256/zip > package.zip
          echo 'b2751caa18fc06abd0425a4962a2f32796597533bb97a989c19ca4f7b7cfb279  package.zip' | sha256sum -c -
          unzip -p package.zip shared-output/immutable-shared-release.tar.gz > release.tar.gz
          python3 qa/promotion/stage-exact.py
      - name: Commit only verified additive release and two entry paths to staging ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "2a8748aeabc70e75f10f63fa644bcad9f315f26f"
          git -C live -c user.name='Aerial verified release' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish verified central hinge, cap and capture package cb5b4263"
          git -C live push origin HEAD:refs/heads/staging/verified-cb5b4263
          echo "STAGED_COMMIT=$(git -C live rev-parse HEAD)"
          echo "Main and Pages pointers have not been changed by this job."
