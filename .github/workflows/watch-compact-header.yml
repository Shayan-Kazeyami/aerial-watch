name: Watch portrait single-row header comparison
on:
  push:
    branches: [codex/watch-compact-header]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: watch-compact-header-qa
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u watch-compact-header-qa/qa.py
        env:
          ARM: ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-header-${{ matrix.arm }}
          path: watch-compact-header-qa/output/
