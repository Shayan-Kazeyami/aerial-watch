name: Watch unchanged asset cache transition audit
on:
  push:
    branches: [codex/watch-cache-transition]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        arm: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            watch-cache-transition-qa
            preview-b/releases
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u watch-cache-transition-qa/test.py
        env:
          ARM: ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-header-${{ matrix.arm }}
          path: watch-cache-transition-qa/output/
