name: Crown projection cache comparison
on:
  push:
    branches: [qa/crown-projection-20261113]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python crown-projection-qa/build.py
      - run: |
          python -m http.server 8765 >/tmp/watch-http.log 2>&1 &
          WATCH_URL="$(cat crown-projection-qa/url.txt)" python -u crown-projection-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crown-projection-evidence
          path: |
            crown-projection-output
            mobile-output
