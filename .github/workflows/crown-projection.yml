name: Live crown projection verification
on:
  push:
    branches: [qa/crown-projection-live-20261113]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: |
          python crown-projection-qa/wait-live.py
          WATCH_URL="https://shayan-kazeyami.github.io/aerial-watch/preview-b/releases/298e08004378120dfc63db15e9692edf43d4a551b41dc665c836cde974e3d68e/atelier-preview.html" python -u crown-projection-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crown-projection-evidence
          path: |
            crown-projection-output
            mobile-output
