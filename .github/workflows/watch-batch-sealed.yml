name: Immutable watch batch candidate verification
on:
  push:
    branches: [codex/watch-batch-sealed-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sealed-software-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test watch-batch-integration-review-v1/tests/*.mjs loading.test.mjs loading-v2.test.mjs loading-v3.test.mjs crown-unified-qa/gesture.test.mjs
      - run: python watch-batch-seal-candidate-v1/build.py && python watch-batch-seal-candidate-v1/verify.py
      - run: python -m pip install playwright pillow numpy && python -m playwright install --with-deps chromium
      - run: python watch-batch-seal-candidate-v1/run_sealed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-watch-batch-software-evidence
          path: |
            watch-batch-browser-evidence
            watch-batch-live-evidence
            watch-batch-seal-candidate-v1/*.json
            watch-batch-seal-candidate-v1/release-id.txt
