name: WebGPU controls and eight-case benchmark acceptance
on:
  push:
    branches: [qa/webgpu-controls-20261113]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [fallback, webgpu, webgpu-vulkan]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: node --test webgpu-controls-qa/benchmark.test.mjs
      - run: |
          python -m http.server 8765 >/tmp/watch-server.log 2>&1 &
          QA_MODE=${{ matrix.mode }} python webgpu-controls-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-controls-${{ matrix.mode }}
          path: webgpu-controls-evidence
