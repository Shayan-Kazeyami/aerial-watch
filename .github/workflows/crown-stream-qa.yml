name: Continuous crown stream acceptance
on:
  push:
    branches: [qa/crown-stream-20261113]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: ln -s ../preview-b/releases/f3ab38493b7bc5c4af84728add913e54938d0db276143a7b765a7803f361bb44/vendor crown-stream-qa/vendor && node --test crown-stream-qa/unit.mjs
      - run: QA_OUTPUT=mobile-experience-evidence python crown-stream-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-experience-evidence
          path: mobile-experience-evidence
