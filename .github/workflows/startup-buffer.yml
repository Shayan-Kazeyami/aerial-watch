name: Startup buffering byte identity and visual QA
on:
  push:
    branches: [qa/startup-buffer-20261113]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: node startup-buffer-qa/test.mjs preview-b/releases/ff188ba605b3868d174bec75b643470c86fb164c706c5ff0b2d4ee89c2472947/hybrid-case-assets/hybrid-innerseat-density-r02.meshopt.glb.gz
      - run: python startup-buffer-qa/build.py
      - run: |
          python -m http.server 8765 >/tmp/watch-http.log 2>&1 &
          WATCH_URL="$(cat startup-buffer-qa/url.txt)" python -u startup-buffer-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-buffer-evidence
          path: |
            startup-buffer-output
            mobile-output
