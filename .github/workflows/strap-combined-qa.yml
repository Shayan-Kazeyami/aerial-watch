name: Structured leather and serialized keeper combined QA
on:
  push:
    branches: [qa/strap-combined-20261113]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        assets: [raw, meshopt]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install numpy playwright pillow && python -m playwright install --with-deps chromium
      - run: python strap-combined-qa/build.py
      - run: |
          python -m http.server 8765 >/tmp/watch-server.log 2>&1 &
          QA_ASSETS=${{ matrix.assets }} python strap-combined-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strap-combined-${{ matrix.assets }}
          path: |
            strap-combined-evidence-*
            strap-combined-qa/build-report.json
            strap-combined-qa/leather-export-report.json
            strap-combined-qa/encoding-report.json
            strap-combined-qa/release
