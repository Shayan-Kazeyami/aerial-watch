name: Caseback exact sealed fallback recovery QA
on:
  push:
    branches: [qa/caseback-fallback-recovery-20261114]
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy playwright pillow && python -m playwright install --with-deps chromium
      - run: |
          WATCH_BASE=preview-b/releases/09e3e0ae0d5b40ddfefdbb3b3987b6dd74ec9a746f5e4f4e0731771b89230a29 python case-topology-lane/caseback-integration/bake.py
          node case-topology-lane/caseback-integration/encode.mjs
          WATCH_BASE=preview-b/releases/09e3e0ae0d5b40ddfefdbb3b3987b6dd74ec9a746f5e4f4e0731771b89230a29 python case-topology-lane/caseback-integration/build.py
          node --test crown-unified-qa/gesture.test.mjs
      - run: |
          python -m http.server 8765 >/tmp/caseback-fallback-http.log 2>&1 &
          QA_ASSETS=fallback QA_VIEWPORT=430x932 python -u case-topology-lane/caseback-integration/check-fallback-recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caseback-exact-fallback-recovery
          path: |
            case-topology-lane/caseback-integration/evidence-fallback-430x932
            case-topology-lane/caseback-integration/release
            case-topology-lane/caseback-integration/bake-report.json
            case-topology-lane/caseback-integration/encoding-report.json
            case-topology-lane/caseback-integration/build-report.json
