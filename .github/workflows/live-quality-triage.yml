name: Isolated quality input triage
on:
  push:
    branches: ['qa/live-quality-triage-20261108']
permissions:
  contents: read
jobs:
  exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        case: [fresh, after_studio]
    env:
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: timeout 15m python qa/final-interaction/quality-triage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-triage-${{ matrix.case }}
          path: quality-triage-output
