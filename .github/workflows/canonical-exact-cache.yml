name: Canonical exact cache baked normals composition
on:
  push:
    branches: [qa/canonical-exact-cache-20261114]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [baked-raw, baked-meshopt]
    env:
      COMPOSE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.mode != 'current'
        with:
          ref: 64fff6296e7d23f00ef387fa222ef405da3c8fba
          path: normal-fixture
      - run: |
          cd normal-fixture
          tar -xzf hardware-current-fixture.tar.gz -C hardware-normal-qa
          node hardware-normal-qa/ci-bake.mjs preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6/rebuild/assembly.glb
          node hardware-normal-qa/e79-rebase/ci-encode.mjs
        if: matrix.mode != 'current'
      - run: python -m pip install playwright pillow numpy && python -m playwright install --with-deps chromium
      - run: python isolated-runtime-composition/recovery-2155/viewer-normal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-exact-cache-${{ matrix.mode }}-evidence
          path: isolated-runtime-composition/recovery-2155/viewer-evidence
