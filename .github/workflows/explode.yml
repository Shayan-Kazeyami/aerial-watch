name: Verify exploded movement
on:
  push:
    branches: ['qa/exploded-movement-20261110']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        scope: [desktop, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python explode-ci/build.py
      - name: Test exact candidate modules
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path(json.loads(pathlib.Path('explode-output/build.json').read_text())['releasePath'])
          testroot=pathlib.Path('explode-unit');testroot.mkdir(exist_ok=True)
          for name in ['assembly-explode.js','assembly-review.js','assembly-framing.js']: shutil.copyfile(root/name,testroot/name)
          shutil.copytree('explode-ci/tests',testroot/'tests',dirs_exist_ok=True)
          manifest=json.loads((root/'deployment-manifest.json').read_text())
          for f in manifest['references']:
              if f['path'].startswith('vendor/'):
                  dest=testroot/f['path'];dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(root.parent/f['ownerReleaseId']/f['path'],dest)
          PY
          ROOT=$(python -c "import json;print(json.load(open('explode-output/build.json'))['releasePath'])")
          node --test explode-unit/tests/*.test.mjs
          for f in "$ROOT"/*.js; do node --check "$f" || exit 1; done
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m http.server 8765 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
      - run: timeout 24m env QA_SCOPE=${{ matrix.scope }} python -u explode-ci/qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploded-movement-${{ matrix.scope }}
          path: explode-output
