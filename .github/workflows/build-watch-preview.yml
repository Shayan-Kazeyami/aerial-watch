name: Build exact immutable Watch0116 preview branch only
on:
  push:
    branches: [qa/build-watch-preview-0116-20261114]
    paths: [watch-authorized-retry/publish-preview/**, .github/workflows/build-watch-preview.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 64fff6296e7d23f00ef387fa222ef405da3c8fba
          path: normal-fixture
      - uses: actions/checkout@v4
        with:
          ref: e305819445671ba9bc24734a902646204a08801e
          path: seconds-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: |
          cd normal-fixture
          tar -xzf hardware-current-fixture.tar.gz -C hardware-normal-qa
          node hardware-normal-qa/ci-bake.mjs preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6/rebuild/assembly.glb
          node hardware-normal-qa/e79-rebase/ci-encode.mjs
      - run: |
          cd seconds-fixture
          python qa-seconds-ring/pack.py preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6/premium-face/face-svg04.glb
          node qa-seconds-ring/encode.mjs
      - run: |
          WATCH_BASE=preview-b/releases/e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6 NORMAL_INPUT=normal-fixture/hardware-normal-qa/e79-rebase RING_INPUT=seconds-fixture/qa-seconds-ring RUNTIME_INPUT=coordinated-release-successor python coordinated-release-successor/build.py
          test "$(cat coordinated-release-successor/release-id.txt)" = 011614d052b49dd32652ec25e31bd471addef053bfda24510d7741485fe37192
          python -m unittest discover -s watch-authorized-retry/publish-preview -p 'test_*.py' -v
          python -u watch-authorized-retry/publish-preview/build_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immutable-watch-preview-proof
          path: |
            watch-authorized-retry/publish-preview/evidence
            coordinated-release-successor/build-report.json
            coordinated-release-successor/release-id.txt
