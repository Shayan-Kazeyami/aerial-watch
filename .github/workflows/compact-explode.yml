name: Compact Explode mobile acceptance
on:
  push:
    branches: [qa/compact-explode-20261113]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 >/tmp/compact-explode-server.log 2>&1 &
          python compact-explode-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-explode-evidence
          path: compact-explode-evidence
