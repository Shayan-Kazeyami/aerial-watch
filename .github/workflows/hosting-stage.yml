name: Exact hosting stage browser QA
on:
  push:
    branches: ['qa/watch-hosting-stage-*']
permissions:
  contents: read
jobs:
  hosting-stage-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out QA tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: qa
      - name: Check out exact unpromoted hosting stage
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2a8748aeabc70e75f10f63fa644bcad9f315f26f
          path: staged-site
          persist-credentials: false
          fetch-depth: 1
          lfs: false
      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install existing pinned browser harness
        run: npm install --prefix qa/browser --ignore-scripts --no-audit --no-fund
      - name: Test exact staged files under real Pages subpath
        env:
          STAGED_SITE: ${{ github.workspace }}/staged-site
          HOSTING_QA_URL: http://127.0.0.1:8766/aerial-watch/
          HOSTING_QA_ARTIFACTS: ${{ github.workspace }}/qa/browser/hosting-stage-artifacts
          CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          test "$(git -C staged-site rev-parse HEAD)" = 2a8748aeabc70e75f10f63fa644bcad9f315f26f
          test -z "$(git -C staged-site status --porcelain)"
          test -x "$CHROMIUM_EXECUTABLE_PATH"
          mkdir -p "$RUNNER_TEMP/hosting-stage-www"
          ln -s "$GITHUB_WORKSPACE/staged-site" "$RUNNER_TEMP/hosting-stage-www/aerial-watch"
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/hosting-stage-www" > "$RUNNER_TEMP/hosting-stage-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/aerial-watch/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8766/aerial-watch/ >/dev/null
          node qa/browser/hosting-stage.cjs
      - name: Preserve limited QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosting-stage-browser-qa
          path: qa/browser/hosting-stage-artifacts
          if-no-files-found: ignore
          retention-days: 7
