name: Isolated sealed interaction regression
on:
  push:
    branches: ['qa/final-interaction-20261108']
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: transmission-sealed-release
          run-id: 42473659744
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/sealed
      - run: tar -xzf /tmp/sealed/sealed-release.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python -m http.server 8766 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
      - run: timeout 18m python qa/final-interaction/test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-interaction-evidence
          path: qa-deliverables/final-interaction-regression/output
