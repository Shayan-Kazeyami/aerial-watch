name: Isolated case shading macro
on:
  push:
    branches: [qa/case-shading-macro-20261114]
    paths: [.github/workflows/case-shading-macro.yml]
permissions:
  contents: read
jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - name: Matched read-only hosted macros
        run: |
          mkdir -p isolated-case-shading-audit
          cat > /tmp/shading.py <<'PYQA'
          import asyncio,json,pathlib,hashlib,base64
          from playwright.async_api import async_playwright
          O=pathlib.Path('isolated-case-shading-audit');rid='e79b22365b4874327d308eca789326fbea0da8d717ffca20da80b611e36b39c6'
          async def run():
           R={'release':rid,'setup':'Chromium SwiftShader software WebGL2; no physical GPU/FPS claim','errors':[],'captures':{}}
           async with async_playwright() as p:
            b=await p.chromium.launch(args=['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']);page=await b.new_page(viewport={'width':932,'height':600},device_scale_factor=3);page.on('pageerror',lambda e:R['errors'].append(str(e)))
            async def patch(route):
             response=await route.fetch();source=await response.text();sha=hashlib.sha256(source.encode()).hexdigest();assert sha=='91fcb25fbcc71e7e259dc603ba019d8c626e8506399dc14cf3c12075cc0fa4ee',sha;R['viewerSHA256']=sha
             extra='''
          window.shadingPrepare=()=>{cancelCrownGesture();resetMotion();$('animate').checked=false;$('animate-movement').checked=false;clock.setRunning('hands',false);clock.setRunning('mechanism',false);view('crown',false);cameraTween=null;controls.update();controls.enabled=false;dirty=true;};
          window.shadingQuality=(name)=>{renderingQuality(name);ao.enabled=false;bloom.enabled=false;renderer.shadowMap.enabled=false;key.castShadow=false;dirty=true;};
          window.shadingCapture=()=>{renderer.info.reset();composer.render();return {png:renderer.domElement.toDataURL('image/png'),quality,devicePixelRatio:window.devicePixelRatio,buffer:[renderer.domElement.width,renderer.domElement.height],pixelRatio:renderer.getPixelRatio(),camera:{position:camera.position.toArray(),quaternion:camera.quaternion.toArray(),target:controls.target.toArray(),zoom:camera.zoom},clock:clock.snapshot(),backend:backendIdentity,materialFeatures:{ao:ao.enabled,bloom:bloom.enabled,shadows:renderer.shadowMap.enabled,smaa:!!smaa},modelMatrix:model.matrixWorld.toArray()};};
          '''
             await route.fulfill(response=response,body=source+extra)
            await page.route('**/assembly-review.js*',patch)
            try:
             await page.goto('https://shayan-kazeyami.github.io/aerial-watch/?shading-audit=macro',wait_until='domcontentloaded');await page.wait_for_timeout(15000)
             f=next(f for f in page.frames if rid in f.url);R['frameURL']=f.url
             await f.locator('body[data-ready=true]').wait_for(timeout=300000);await f.wait_for_function('document.querySelector("#stage").dataset.cameraReady==="true"',timeout=300000)
             await f.evaluate('shadingPrepare()');await page.wait_for_timeout(2000)
             for q in ['efficient','detail','studio','efficient']:
              await f.evaluate('(q)=>shadingQuality(q)',q);await page.wait_for_timeout(3000);r=await f.evaluate('shadingCapture()');png=r.pop('png');key=q if q not in R['captures'] else q+'-repeat';(O/(key+'-native.png')).write_bytes(base64.b64decode(png.split(',')[1]));R['captures'][key]=r;print(key,r['buffer'],r['pixelRatio'],flush=True)
             cams=[x['camera']for x in R['captures'].values()];assert all(x==cams[0]for x in cams);R['cameraExact']=True;assert not R['errors'],R['errors']
            finally:
             (O/'macro-report.json').write_text(json.dumps(R,indent=2));await b.close()
          asyncio.run(run())
          PYQA
          python /tmp/shading.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-shading-native-macros
          path: isolated-case-shading-audit/

