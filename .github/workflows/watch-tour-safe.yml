name: Guided tour safe framing candidate
on:
  push:
    branches: [codex/watch-tour-safe-view]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        view: [820x600, 430x932, 932x430, 1440x900, 360x640]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: preview-b/candidates/tour-safe
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python preview-b/candidates/tour-safe/browser.py
        env:
          VIEW: ${{ matrix.view }}
          MOTION: ${{ matrix.view == '820x600' && 'no-preference' || 'reduce' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-safe-${{ matrix.view }}
          path: preview-b/candidates/tour-safe/output/
