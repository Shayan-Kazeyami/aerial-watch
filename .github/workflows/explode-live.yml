name: Verify published exploded movement
on:
  push:
    branches: ['qa/exploded-live-20261111']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        scope: [desktop, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python explode-live-ci/prepare.py
      - run: node --test explode-live-unit/tests/*.test.mjs
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: timeout 18m env QA_SCOPE=${{ matrix.scope }} python -u explode-live-ci/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploded-live-${{ matrix.scope }}
          path: explode-live-output
