name: Watch Studio matched lighting study
on:
  push:
    branches: [codex/watch-studio-light-match]
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        view: [1440x900, 430x932]
        light: [softbox, studio4]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: watch-studio-qa
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u watch-studio-qa/browser.py
        env:
          VIEW: ${{ matrix.view }}
          LIGHT: ${{ matrix.light }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-${{ matrix.view }}-${{ matrix.light }}
          path: watch-studio-qa/output/
