name: Native two-finger selection diagnostic
on:
  push:
    branches: [qa/native-touch-selection-20261114]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8766 >/tmp/touch-server.log 2>&1 &
          python -u isolated-touch-selection-audit/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-touch-selection
          path: isolated-touch-selection-audit/evidence
