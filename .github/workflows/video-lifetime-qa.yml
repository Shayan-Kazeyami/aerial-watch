name: Isolated video readback lifetime WebCodecs QA
on:
  push:
    branches: [qa/video-readback-lifetime-20261114]
    paths: [qa-video-lifetime/**, .github/workflows/video-lifetime-qa.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python qa-video-lifetime/prepare-browser.py
      - run: |
          python -m http.server 8873 --bind 127.0.0.1 >/tmp/video-server.log 2>&1 &
          python -u qa-video-lifetime/browser-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-lifetime-real-webcodecs
          path: |
            qa-video-lifetime/evidence/
            qa-video-lifetime/source-proof.json
