name: First-use touch discovery QA
on:
  push:
    branches: [qa/first-use-20261113]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: node first-use-qa/test.mjs
      - run: python first-use-qa/build.py
      - run: |
          python -m http.server 8765 >/tmp/watch-http.log 2>&1 &
          WATCH_URL="$(cat first-use-qa/url.txt)" python -u first-use-qa/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-use-evidence
          path: |
            first-use-output
            mobile-output
